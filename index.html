<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>การ์ตูนพระคัมภีร์ไร้คำ</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(135deg,#ffd6ff,#a0e7ff,#caffbf);
    text-align:center;
}

.box{
    width:92%;
    max-width:520px;
    margin:25px auto;
    background:white;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    overflow:hidden;
}

/* การ์ตูน */
.scene{
    width:100%;
    height:320px;
    position:relative;
    overflow:hidden;
}

/* พระเยซู */
.jesus{
    width:120px;
    position:absolute;
    bottom:20px;
    left:20px;
    animation: float 2s infinite ease-in-out;
}

/* เด็ก */
.child{
    width:90px;
    position:absolute;
    bottom:20px;
    right:20px;
}

/* ขนมปัง/ปลา */
.item{
    position:absolute;
    width:60px;
    top:120px;
    left:50%;
    transform:translateX(-50%);
    transition:0.5s;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

button{
    margin:10px;
    padding:10px 15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(135deg,#ff6bcb,#7afcff);
    color:white;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<div class="scene">

<!-- พระเยซู (การ์ตูน SVG) -->
<svg class="jesus" viewBox="0 0 200 220">
<circle cx="100" cy="60" r="35" fill="#f7c59f"/>
<path d="M65 60 Q100 10 135 60 Q120 45 100 50 Q80 45 65 60" fill="#5b3a29"/>
<circle cx="88" cy="70" r="4"/>
<circle cx="112" cy="70" r="4"/>
<path d="M85 85 Q100 100 115 85" stroke="black" stroke-width="3" fill="none"/>
<rect x="60" y="105" width="80" height="90" rx="20" fill="#fff"/>
</svg>

<!-- เด็ก -->
<svg class="child" viewBox="0 0 200 220">
<circle cx="100" cy="60" r="30" fill="#ffd1a9"/>
<circle cx="90" cy="60" r="4"/>
<circle cx="110" cy="60" r="4"/>
<path d="M90 75 Q100 85 110 75" stroke="black" stroke-width="3" fill="none"/>
<rect x="70" y="95" width="60" height="80" rx="15" fill="#a0e7ff"/>
</svg>

<!-- ของ -->
<img id="item" class="item" src="https://cdn-icons-png.flaticon.com/512/135/135620.png">

</div>

<button onclick="prev()">⬅</button>
<button onclick="next()">➡</button>
<button onclick="speak()">🔊</button>

</div>

<script>

let step = 0;

let scenes = [
{
item:"https://cdn-icons-png.flaticon.com/512/135/135620.png",
speak:"เด็กมีอาหารเล็กน้อย"
},
{
item:"https://cdn-icons-png.flaticon.com/512/135/135637.png",
speak:"พระเยซูรับอาหารและอธิษฐาน"
},
{
item:"https://cdn-icons-png.flaticon.com/512/2913/2913465.png",
speak:"เกิดอัศจรรย์ อาหารเพิ่มขึ้น"
},
{
item:"https://cdn-icons-png.flaticon.com/512/1046/1046784.png",
speak:"เลี้ยงคนมากมาย ทุกคนอิ่ม"
}
];

function update(){
document.getElementById("item").src = scenes[step].item;
}

/* 🔊 เสียงเล่า */
function speak(){
let msg = new SpeechSynthesisUtterance(scenes[step].speak);
msg.lang = "th-TH";
msg.rate = 0.9;
msg.pitch = 1.3;
speechSynthesis.speak(msg);
}

function next(){
if(step < scenes.length-1){
step++;
update();
}
}

function prev(){
if(step > 0){
step--;
update();
}
}

update();
</script>

</body>
</html>
