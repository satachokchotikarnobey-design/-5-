<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>การ์ตูนพระคัมภีร์</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(135deg,#a0e7ff,#ffeaa7);
    text-align:center;
}

.header{
    padding:20px;
    font-size:26px;
    font-weight:bold;
    background:rgba(255,255,255,0.85);
}

.box{
    width:90%;
    max-width:500px;
    margin:30px auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.scene{
    padding:20px;
}

/* ตัวละคร */
.jesus{
    width:120px;
    height:160px;
    margin:auto;
}

/* ปุ่ม */
button{
    margin:10px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#ff6bcb;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">📖 การ์ตูนพระคัมภีร์ (ตัวละครจริง)</div>

<div class="box">

<div class="scene">

<!-- ตัวการ์ตูนพระเยซู (SVG วาดเอง) -->
<svg class="jesus" viewBox="0 0 200 260">

<!-- หัว -->
<circle cx="100" cy="60" r="35" fill="#f2c9a0"/>

<!-- ผม -->
<path d="M65,55 Q100,10 135,55 Q120,40 100,45 Q80,40 65,55" fill="#5b3a29"/>

<!-- หนวดเครา -->
path d="M80,75 Q100,100 120,75 Q110,110 100,115 Q90,110 80,75" fill="#3b2a22"/>

<!-- ตัวเสื้อ -->
<rect x="60" y="100" width="80" height="120" rx="20" fill="#ffffff" stroke="#ccc"/>

<!-- สายคาด -->
<rect x="60" y="150" width="80" height="10" fill="#ffcc66"/>

<!-- มือ -->
<circle cx="55" cy="140" r="10" fill="#f2c9a0"/>
<circle cx="145" cy="140" r="10" fill="#f2c9a0"/>

</svg>

<h2 id="title">🐟 จุดเริ่มต้น</h2>

<p id="text">
เด็กคนหนึ่งมีปลาทู 5 ตัว และขนมปัง 3 ก้อนเล็ก ๆ
</p>

<button onclick="prev()">⬅ ก่อนหน้า</button>
<button onclick="next()">➡ ถัดไป</button>

</div>

</div>

<script>

let step = 0;

let story = [
{
title:"🐟 จุดเริ่มต้น",
text:"เด็กคนหนึ่งมีปลาทู 5 ตัว และขนมปัง 3 ก้อนเล็ก ๆ"
},
{
title:"🙏 พระเยซูรับอาหาร",
text:"พระเยซูทรงรับอาหารนั้นและอธิษฐานต่อพระเจ้า"
},
{
title:"✨ อัศจรรย์เกิดขึ้น",
text:"พระเจ้าทรงเพิ่มอาหารอย่างมหัศจรรย์ ไม่เคยหมด"
},
{
title:"🍞 เลี้ยงคน 5,000 คน",
text:"อาหารพอเลี้ยงคนมากกว่า 5,000 คน ทุกคนอิ่ม"
}
];

function update(){
document.getElementById("title").innerText = story[step].title;
document.getElementById("text").innerText = story[step].text;
}

function next(){
if(step < story.length - 1){
step++;
update();
}
}

function prev(){
if(step > 0){
step--;
update();
}
}

</script>

</body>
</html>
